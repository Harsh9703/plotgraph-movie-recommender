# Phase 6 Configuration: Grounded, Auditable Recommendation Explanations

inputs:
  model_path: "data/processed/ml-1m/final_eval/final_reranker.joblib"
  predictions_path: "data/processed/ml-1m/final_eval/test_candidate_predictions_unlabeled.parquet"
  features_path: "data/processed/ml-1m/final_eval/test_candidate_features.parquet"
  train_path: "data/processed/ml-1m/splits/train.parquet"
  val_path: "data/processed/ml-1m/splits/val.parquet"
  metadata_path: "data/processed/ml-1m/metadata/movies_with_tmdb.parquet"
  semantic_path: "data/processed/ml-1m/kg_l/full_extraction/semantic_validated.parquet"
  emotion_vectors_path: "data/processed/ml-1m/kg_l/full_extraction/emotion_vectors.parquet"
  emotion_evidence_path: "data/processed/ml-1m/kg_l/full_extraction/emotion_validated_evidence.jsonl"
