# Knowledge Graph LLM Extraction Contract and Pilot Configuration (Phase 3C & 3D)

paths:
  # Input Phase 3A verified unified metadata artifact
  input_metadata_parquet: "data/processed/ml-1m/metadata/movies_with_tmdb.parquet"

  # Phase 3C sample output
  output_dir: "data/processed/ml-1m/kg_l"
  sample_movies_parquet: "data/processed/ml-1m/kg_l/sample_movies.parquet"
  sample_summary_json: "data/processed/ml-1m/kg_l/sample_summary.json"

  # Phase 3D pilot output paths (v1.0.0 baseline)
  pilot_output_dir: "data/processed/ml-1m/kg_l/pilot"
  raw_outputs_jsonl: "data/processed/ml-1m/kg_l/pilot/raw_outputs.jsonl"
  validated_extractions_jsonl: "data/processed/ml-1m/kg_l/pilot/validated_extractions.jsonl"
  failures_jsonl: "data/processed/ml-1m/kg_l/pilot/failures.jsonl"
  pilot_summary_json: "data/processed/ml-1m/kg_l/pilot/pilot_summary.json"
  pilot_review_csv: "data/processed/ml-1m/kg_l/pilot/pilot_review.csv"

  # Phase 3D pilot output paths (v1.1.0 refined prompt)
  pilot_v1_1_output_dir: "data/processed/ml-1m/kg_l/pilot_v1_1"
  raw_outputs_v1_1_jsonl: "data/processed/ml-1m/kg_l/pilot_v1_1/raw_outputs.jsonl"
  validated_extractions_v1_1_jsonl: "data/processed/ml-1m/kg_l/pilot_v1_1/validated_extractions.jsonl"
  failures_v1_1_jsonl: "data/processed/ml-1m/kg_l/pilot_v1_1/failures.jsonl"
  pilot_summary_v1_1_json: "data/processed/ml-1m/kg_l/pilot_v1_1/pilot_summary.json"
  pilot_review_v1_1_csv: "data/processed/ml-1m/kg_l/pilot_v1_1/pilot_review.csv"

ontology:
  semantic_relations:
    - hasTheme
    - hasSetting
    - hasNarrativeDevice
    - hasProtagonistType
    - basedOn
  emotion_relation: evokesEmotion
  plutchik_emotions:
    - joy
    - trust
    - fear
    - surprise
    - sadness
    - disgust
    - anger
    - anticipation
  emotion_edge_threshold: 0.5

llm:
  model_id: "Qwen/Qwen2.5-7B-Instruct"
  prompt_version: "v1.1.0"
  schema_version: "v1.0.0"
  # Pilot inference parameters
  temperature: 0.0
  max_tokens: 1024
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.90
  max_retries: 1
  max_pilot_movies: 30

sampling:
  sample_size: 30
  random_seed: 42
