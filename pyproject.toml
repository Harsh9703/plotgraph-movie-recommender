[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plotgraph"
version = "0.1.0"
description = "Explainable, Emotion-Aware Movie Recommendation with LLM-Extracted Knowledge Graphs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "implicit>=0.7.0",
    "tqdm>=4.27",
    "pyarrow>=12.0.0",
    "rdflib>=7.0.0",
    "pydantic>=2.0.0",
    "scikit-learn>=1.2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]
text = [
    "scikit-learn>=1.2.0",
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.0",
]
nrc = [
    "nrclex>=4.0.0",
]
gpu = [
    "vllm>=0.6.0",
    "torch>=2.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
